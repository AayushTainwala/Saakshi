name: Native build

# Compiles the app with its local Expo modules (Kotlin and Swift) on GitHub's runners, because cloud
# sessions can't reach Android's or Apple's build tools. Every run also uploads two test builds, with
# the JavaScript bundled in so no development server is needed (docs/BUILD_HANDOFF.md, "How to try a
# build on your Mac"):
# - Saakshi-<sha>-android-emulator.apk: release build signed with the public debug key, with the
#   GitHub APK's flags (SMS auto-send on). For emulators and test phones only; never publish it.
# - Saakshi-<sha>-ios-simulator.zip: Release build of Saakshi.app for the iOS Simulator, unsigned.
# Real releases are the EAS pipeline in release.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/**'
      - 'app.json'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-build.yml'

env:
  # On a pull request GITHUB_SHA is GitHub's merge commit; name the builds after the branch's commit.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: native-build-${{ github.ref }}
  # Let a running build finish; GitHub keeps only the newest waiting run.
  cancel-in-progress: false

jobs:
  hashing-jvm:
    name: Streaming hash on a 1 GiB file (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: modules/saakshi-evidence/verify/verify-hashing.sh 1024

  android:
    name: Android emulator build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SAAKSHI_CHANNEL: github
      SAAKSHI_SMS_AUTOSEND: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Gradle build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          apk="Saakshi-${COMMIT::7}-android-emulator.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$apk"
          echo "file=$apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Xcode build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace Saakshi.xcworkspace -scheme Saakshi -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -200
      - name: Zip the app
        id: app
        run: |
          set -euo pipefail
          app=ios/build/Build/Products/Release-iphonesimulator/Saakshi.app
          [ -f "$app/main.jsbundle" ] || { echo "::error::The JavaScript bundle is missing from Saakshi.app."; exit 1; }
          zip="Saakshi-${COMMIT::7}-ios-simulator.zip"
          ditto -c -k --keepParent "$app" "$zip"
          echo "file=$zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.app.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 30
