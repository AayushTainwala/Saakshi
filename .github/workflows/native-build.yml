name: Native build

# Compiles the app with its local Expo modules (Kotlin and Swift) on GitHub's runners, because cloud
# sessions can't reach Android's or Apple's build tools. Debug builds only, unsigned; releases are
# Stream D's EAS pipeline.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-build.yml'

concurrency:
  group: native-build-${{ github.ref }}
  # Let a running build finish; GitHub keeps only the newest waiting run.
  cancel-in-progress: false

jobs:
  hashing-jvm:
    name: Streaming hash on a 1 GiB file (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: modules/saakshi-evidence/verify/verify-hashing.sh 1024

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Gradle build
        working-directory: android
        # Compiler errors are also raised as annotations, so they can be read without the log.
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E '^e: |error: |What went wrong' -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $status

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Xcode build
        working-directory: ios
        run: |
          set +e
          xcodebuild -workspace Saakshi.xcworkspace -scheme Saakshi -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          tail -200 build.log
          grep -E 'error: ' build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $status
